<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ScanDirect : scannez vos documents, recadrage automatique, filtres, PDF, OCR, signature.">
<meta name="theme-color" content="#0D7A5C">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScanDirect">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>ScanDirect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first app shell (max 560px), bottom nav + central scan button; editors are full-screen dark stages. */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --ink:#14201B; --muted:#5B6964; --line:#D9E0DB;
  --accent:#0D7A5C; --accent-ink:#FFFFFF; --accent-soft:#DCEEE6; --amber:#E9A21F; --danger:#B93C28;
  --stage:#0E1412; --stage-2:#1A2320; --stage-ink:#ECF2EE; --stage-muted:#93A39C;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 6px 20px rgba(20,32,27,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#161F1C; --ink:#E6EEEA; --muted:#93A39C; --line:#26332E;
  --accent:#3CC496; --accent-ink:#04140E; --accent-soft:#14332A; --amber:#F0B13A; --danger:#EE7A63;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#161F1C; --ink:#E6EEEA; --muted:#93A39C; --line:#26332E;
  --accent:#3CC496; --accent-ink:#04140E; --accent-soft:#14332A; --amber:#F0B13A; --danger:#EE7A63;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:18px 10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand small{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.04em;margin-left:2px}
main{flex:1;padding-block:4px 120px}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;height:100%}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}

.doclist{display:flex;flex-direction:column;gap:10px}
.docrow{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%}
.docrow:hover{border-color:var(--accent)}
.thumb{width:58px;height:76px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden;flex:none;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .n{position:absolute;right:3px;bottom:3px;background:rgba(14,20,18,.75);color:#fff;font-family:var(--f-mono);font-size:10px;padding:1px 5px;border-radius:4px}
.docrow .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.docrow .meta h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.qbtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
.qbtn .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none}
nav.bottom .bar{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 96px 1fr;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);padding-top:6px}
.navbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px}
.navbtn[aria-current="page"]{color:var(--accent);font-weight:600}
.fab{justify-self:center;width:66px;height:66px;margin-top:-30px;border-radius:50%;border:4px solid var(--bg);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(13,122,92,.35)}
.fab svg{width:28px;height:28px}

.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.tool:hover{border-color:var(--accent)}
.tool .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tool p{margin:0;font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input[type=text],.field input[type=number],.field select,.field textarea{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;width:100%}
.field textarea{height:auto;min-height:220px;padding:12px;line-height:1.5;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
input[type=range]{width:100%;accent-color:var(--accent)}

/* document view */
.dochead{display:flex;align-items:center;gap:10px;padding-block:14px 6px}
.dochead input{flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:20px;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px}
.dochead input:hover,.dochead input:focus{border-color:var(--line);background:var(--surface);outline:0}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:12px}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;text-align:left}
.pg .img{aspect-ratio:210/297;width:100%;max-width:100%;background:var(--bg);border-radius:6px;overflow:hidden;display:grid;place-items:center}
.pg img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pg .mono{display:flex;justify-content:space-between;color:var(--muted)}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none}
.actions .bar{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);padding-top:6px}
.actions button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;padding:6px 2px;color:var(--ink)}
.actions button.hl{color:var(--accent);font-weight:600}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,12,10,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88%;overflow:auto}
.sheet .in{max-width:560px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding-block:10px calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:14px;padding:13px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.menu button:last-child{border-bottom:0}
.menu .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.menu small{display:block;color:var(--muted);font-size:12.5px}

/* stage (editors) */
.stage{position:fixed;inset:0;z-index:20;background:var(--stage);color:var(--stage-ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.stage .tb{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.stage .tb h2{font-size:17px;flex:1;min-width:0}
.sbtn{height:40px;padding:0 14px;border-radius:10px;border:1px solid #2C3833;background:var(--stage-2);color:var(--stage-ink);display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.sbtn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sbtn.ghost{background:transparent;border-color:transparent}
.area{flex:1;position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;touch-action:none}
.area canvas{display:block;box-shadow:0 4px 30px rgba(0,0,0,.5)}
.overlay{position:absolute;overflow:visible}
.overlay polygon{fill:rgba(60,196,150,.14);stroke:#3CC496;stroke-width:2}
.overlay .h.m{fill:#3CC496;stroke:#fff;stroke-width:2}
#cam-v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#cam-ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;background:rgba(14,20,18,.75);color:var(--stage-ink);padding:8px 14px;border-radius:20px;font-size:14px;white-space:nowrap;display:flex;gap:10px;align-items:center}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#3CC496;box-shadow:inset 0 0 0 4px var(--stage)}
.shutter:active{transform:scale(.94)}
.cam-bb{justify-content:space-around}
.cam-count{min-width:44px;height:44px;border-radius:10px;border:1px solid #2C3833;background:var(--stage-2);color:var(--stage-ink);font-family:var(--f-mono)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.85;transition:none}
.overlay .h{fill:#fff;stroke:#3CC496;stroke-width:3;cursor:grab}
.overlay .hit{fill:transparent;cursor:grab}
.loupe{position:absolute;top:10px;left:10px;width:120px;height:120px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:none}
.stage .bb{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:10px calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.filters{display:flex;gap:10px;overflow-x:auto;padding-block:6px 4px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));scrollbar-width:none}
.fchip{flex:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--stage-muted);font-size:12px}
.fchip canvas{width:58px;height:74px;border-radius:6px;border:2px solid transparent;box-shadow:none;background:#222}
.fchip[aria-pressed="true"]{color:var(--stage-ink);font-weight:600}
.fchip[aria-pressed="true"] canvas{border-color:#3CC496}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,20,18,.55);font-family:var(--f-mono);font-size:13px}
.scanline{width:160px;height:3px;border-radius:2px;background:#3CC496;box-shadow:0 0 12px #3CC496;animation:sl 1.1s ease-in-out infinite alternate}
@keyframes sl{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
@media (prefers-reduced-motion:reduce){.scanline{animation:none}}

/* misc */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.li .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.li button svg{width:16px;height:16px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.pad{width:100%;height:170px;border:1.5px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;display:block}
.sigwrap{position:relative;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:center;touch-action:none}
.sigwrap canvas{display:block;max-width:100%}
.sigwrap img{position:absolute;cursor:move;outline:1.5px dashed var(--accent);outline-offset:2px;user-select:none;-webkit-user-drag:none}
.note{font-size:13px;color:var(--muted);margin:0}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stat b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.ocr-out{font-family:var(--f-mono);font-size:13px}
.big-prev{max-height:52vh;display:grid;place-items:center;background:var(--bg);border-radius:10px;padding:10px}
.big-prev img{max-height:calc(52vh - 20px);box-shadow:0 2px 10px rgba(0,0,0,.15)}
</style>

</head><body>
<div id="app">
  <!-- HOME -->
  <section id="s-home">
    <header class="top wrap">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg></span>ScanDirect<small>v1</small></div>
    </header>
    <main class="wrap">
      <label class="search" for="q"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Rechercher un document" autocomplete="off"></label>
      <div class="quick">
        <button class="qbtn" data-act="camera"><span class="ico"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>Photo</button>
        <button class="qbtn" data-act="gallery"><span class="ico"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></span>Importer images</button>
        <button class="qbtn" data-act="importpdf"><span class="ico"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 17v-6M9 14l3 3 3-3"/></svg></span>Importer PDF</button>
      </div>
      <div class="section-head"><h2>Mes documents</h2><span class="mono muted" id="doccount"></span></div>
      <div class="doclist" id="doclist"></div>
    </main>
  </section>

  <!-- TOOLS -->
  <section id="s-tools" hidden>
    <header class="top wrap"><h2 style="font-size:26px">Outils PDF</h2></header>
    <main class="wrap">
      <div class="tools" id="toolgrid"></div>
    </main>
  </section>

  <!-- DOC -->
  <section id="s-doc" hidden>
    <div class="wrap dochead">
      <button class="iconbtn" id="doc-back" aria-label="Retour"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <input id="doc-name" type="text" aria-label="Nom du document">
    </div>
    <main class="wrap">
      <div class="mono muted" id="doc-meta"></div>
      <div class="pages" id="doc-pages"></div>
    </main>
  </section>

  <!-- TOOL PANEL -->
  <section id="s-tool" hidden>
    <div class="wrap dochead">
      <button class="iconbtn" id="tool-back" aria-label="Retour"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="tool-title" style="flex:1"></h2>
    </div>
    <main class="wrap" id="tool-body" style="display:flex;flex-direction:column;gap:14px"></main>
  </section>

  <nav class="bottom" id="nav">
    <div class="bar">
      <button class="navbtn" data-nav="home" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Documents</button>
      <button class="fab" id="fab" aria-label="Scanner un document"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg></button>
      <button class="navbtn" data-nav="tools"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Outils</button>
    </div>
  </nav>

/* ---------- sheet ---------- */
function sheet(html, init){

/* ---------- scan session ---------- */
const inCam = $('#in-camera'), inGal = $('#in-gallery');
function startScan(targetId, src){
  S.session = { target: targetId, pages: [], queue: [], total: 0 };
  if (src === 'camera' && LIVE_CAM) openCam(); else (src === 'camera' ? inCam : inGal).click();
}
function onPicked(e){
  const files = [...e.target.files].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic)$/i.test(f.name)); e.target.value = '';
  if (!files.length || !S.session) return;
  S.session.queue.push(...files); S.session.total += files.length;
  if (S.session.waiting || $('#crop').hidden){ S.session.waiting = false; nextInQueue(); }
}
inCam.addEventListener('change', onPicked); inGal.addEventListener('change', onPicked);

async function nextInQueue(){
  const ss = S.session; const f = ss && ss.queue.shift();
  $('#filt').hidden = true;
  if (!f){ if (ss && ss.pages.length) finishSession(); else closeEditors(); return; }
  $('#crop').hidden = false; busy('#crop-area', 'Chargement…');
  try { if (f.canvas) openCrop(f.canvas, f.q); else openCrop(await fileToCanvas(f)); }
  catch(err){ unbusy('#crop-area'); toast("Cette image n'a pas pu être lue."); nextInQueue(); }
}
function closeEditors(){ closeCam(); $('#crop').hidden = true; $('#filt').hidden = true; S.crop = S.filt = null; }
async function finishSession(){
  const ss = S.session; closeEditors(); S.session = null; if (!ss || !ss.pages.length) return;
  let d = ss.target && S.docs.find(x => x.id === ss.target);
  if (d){ d.pages.push(...ss.pages); d.updated = Date.now(); }
  else { d = { id: uid(), name: 'Scan ' + new Intl.DateTimeFormat('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'}).format(Date.now()) + ' ' + new Date().toTimeString().slice(0,5).replace(':','h'), created: Date.now(), updated: Date.now(), pages: ss.pages }; S.docs.push(d); }
  await Store.put(d); openDoc(d.id); toast(ss.pages.length + (ss.pages.length > 1 ? ' pages enregistrées' : ' page enregistrée'));
}
function busy(sel, msg){ const a = $(sel); unbusy(sel); const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = `<div style="display:grid;place-items:center;gap:14px"><div class="scanline"></div><span>${esc(msg)}</span></div>`; a.appendChild(b); }
function unbusy(sel){ const b = $(sel + ' .busy'); if (b) b.remove(); }

/* ---------- crop editor ---------- */
function openCrop(src, preQ){
  const det = preQ || detectCorners(src);
  S.crop = { src, q: det || defaultCorners(src.width, src.height), auto: !!det };
  const ss = S.session, idx = ss.total - ss.queue.length;
  $('#crop-title').textContent = ss.total > 1 ? `Recadrer · ${idx}/${ss.total}` : 'Recadrer';
  unbusy('#crop-area'); layoutCrop();
}
function layoutCrop(){
  const C = S.crop; if (!C) return; const area = $('#crop-area'), cv = $('#crop-cv'), svg = $('#crop-svg');
  const aw = area.clientWidth - 48, ah = area.clientHeight - 48; const sc = Math.min(aw / C.src.width, ah / C.src.height);
  C.scale = sc; const dw = Math.round(C.src.width*sc), dh = Math.round(C.src.height*sc), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = dw*dpr; cv.height = dh*dpr; cv.style.width = dw + 'px'; cv.style.height = dh + 'px';
  cv.getContext('2d').drawImage(C.src, 0, 0, cv.width, cv.height);
  const r = cv.getBoundingClientRect(), ar = area.getBoundingClientRect();
  Object.assign(svg.style, { left: (r.left - ar.left) + 'px', top: (r.top - ar.top) + 'px', width: dw + 'px', height: dh + 'px' });
  svg.setAttribute('viewBox', `0 0 ${dw} ${dh}`); drawOverlay();
}
function cropFormat(){ const C = S.crop, mode = lsGet('sd-format') || 'auto'; return resolveRatio(estimateRatio(C.q, C.src.width, C.src.height), mode); }
function showFormat(){ const mode = lsGet('sd-format') || 'auto', fr = cropFormat(); $('#crop-fmt').textContent = mode === 'auto' ? `Auto · ${fr.label === 'Format détecté' ? 'autre' : fr.label}` : mode === 'a4' ? 'Toujours A4' : 'Libre'; }
$('#crop-fmt').addEventListener('click', () => { const m = lsGet('sd-format') || 'auto', i = FORMAT_MODES.findIndex(x => x[0] === m); lsSet('sd-format', FORMAT_MODES[(i+1) % 3][0]); showFormat();
  toast({ auto: 'Auto : A4 reconnu automatiquement, sinon format mesuré', a4: 'Toujours A4 : chaque page sort au format A4', free: 'Libre : proportions mesurées sur la photo' }[lsGet('sd-format') || 'auto']); });
function drawOverlay(){
  try { showFormat(); } catch(e){}
  const C = S.crop, svg = $('#crop-svg'), s = C.scale, pts = C.q.map(p => [p[0]*s, p[1]*s]);
  const mids = pts.map((p, i) => [(p[0] + pts[(i+1)%4][0])/2, (p[1] + pts[(i+1)%4][1])/2]);
  svg.innerHTML = `<polygon points="${pts.map(p => p.join(',')).join(' ')}"/>`
    + mids.map((p, i) => `<circle class="hit" data-e="${i}" cx="${p[0]}" cy="${p[1]}" r="20"/><circle class="h m" data-e="${i}" cx="${p[0]}" cy="${p[1]}" r="7"/>`).join('') + pts.map((p, i) => `<circle class="hit" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="26"/><circle class="h" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="11"/>`).join('');
}
(function cropDrag(){
  const svg = $('#crop-svg'), loupe = $('#loupe'); let drag = null;
  const toImg = e => { const C = S.crop, r = svg.getBoundingClientRect(); return [(e.clientX - r.left)/C.scale, (e.clientY - r.top)/C.scale]; };
  svg.addEventListener('pointerdown', e => { const t = e.target.closest('[data-i],[data-e]'); if (!t) return;
    drag = t.dataset.i != null ? { i: +t.dataset.i } : { e: +t.dataset.e, start: toImg(e), q0: S.crop.q.map(p => [...p]) };
    svg.setPointerCapture(e.pointerId); e.preventDefault(); move(e); });
  svg.addEventListener('pointermove', e => { if (drag) move(e); });
  const end = () => { drag = null; loupe.hidden = true; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  const cl = (v, m) => Math.max(0, Math.min(m, v));
  function move(e){
    const C = S.crop, [px, py] = toImg(e); let x, y;
    if (drag.i != null){ x = cl(px, C.src.width); y = cl(py, C.src.height); C.q[drag.i] = [x, y]; }
    else { const a = drag.e, b = (a + 1) % 4, A = drag.q0[a], B = drag.q0[b];
      // move the edge along its normal only
      const L = dist(A, B) || 1, nx = -(B[1]-A[1])/L, ny = (B[0]-A[0])/L, dd = (px - drag.start[0])*nx + (py - drag.start[1])*ny;
      C.q[a] = [cl(A[0] + nx*dd, C.src.width), cl(A[1] + ny*dd, C.src.height)]; C.q[b] = [cl(B[0] + nx*dd, C.src.width), cl(B[1] + ny*dd, C.src.height)];
      x = (C.q[a][0] + C.q[b][0])/2; y = (C.q[a][1] + C.q[b][1])/2; }
    drawOverlay();
    loupe.hidden = false; const lx = loupe.getContext('2d'), z = 60; lx.fillStyle = '#000'; lx.fillRect(0, 0, 240, 240);
    lx.drawImage(C.src, x - z, y - z, z*2, z*2, 0, 0, 240, 240);
    lx.strokeStyle = '#3CC496'; lx.lineWidth = 2; lx.beginPath(); lx.moveTo(120, 96); lx.lineTo(120, 144); lx.moveTo(96, 120); lx.lineTo(144, 120); lx.stroke();
    const ar = $('#crop-area').getBoundingClientRect(); loupe.style.left = (e.clientX - ar.left < ar.width/2 ? ar.width - 140 : 10) + 'px';
  }
})();
window.addEventListener('resize', () => { if (!$('#crop').hidden) layoutCrop(); if (!$('#filt').hidden) drawFilt(); });
$('#crop-auto').addEventListener('click', () => { const q = detectCorners(S.crop.src); if (q){ S.crop.q = q; drawOverlay(); toast('Bords détectés'); } else toast("Bords non détectés : ajustez les coins à la main."); });
$('#crop-full').addEventListener('click', () => { const s = S.crop.src; S.crop.q = [[0,0],[s.width,0],[s.width,s.height],[0,s.height]]; drawOverlay(); });
$('#crop-rot').addEventListener('click', () => { const C = S.crop, w = C.src.width, h = C.src.height; C.src = rotate90(C.src, 1); C.q = C.q.map(([x, y]) => [h - y, x]); C.q = [C.q[3], C.q[0], C.q[1], C.q[2]]; layoutCrop(); });
$('#crop-cancel').addEventListener('click', () => { const ss = S.session; if (ss){ ss.queue = []; } if (ss && ss.pages.length) finishSession(); else { closeEditors(); S.session = null; } });
$('#crop-ok').addEventListener('click', async () => {
  const C = S.crop; if (Math.abs(polyArea(C.q)) < 400){ toast('La zone sélectionnée est trop petite.'); return; }
  busy('#crop-area', 'Correction de la perspective…'); await frame();
  const fr = cropFormat(); const out = warp(C.src, C.q, fr.ratio); unbusy('#crop-area'); openFilt(out); toast('Format : ' + fr.label);

/* ---------- filter editor ---------- */
function openFilt(base){
  S.filt = { base, f: lsGet('sd-filter') || 'magic' }; if (!FILTERS.some(x => x[0] === S.filt.f)) S.filt.f = 'magic';
  $('#crop').hidden = true; $('#filt').hidden = false;
  const ss = S.session, idx = ss.total - ss.queue.length, rem = ss.queue.length;
  $('#filt-title').textContent = ss.total > 1 ? `Filtre · ${idx}/${ss.total}` : 'Filtre';
  $('#filt-more').innerHTML = rem ? `${I.right}Page suivante (${rem})` : `${I.cam}Ajouter une page`;
  $('#filt-done').textContent = `Terminer (${ss.pages.length + 1})`;
  buildPreview(); renderChips(); drawFilt();
}
function buildPreview(){ const F = S.filt; F.prev = scaleCanvas(F.base, 1100); F.cache = {}; }
function previewFor(f){ const F = S.filt; return F.cache[f] || (F.cache[f] = applyFilter(F.prev, f)); }
function renderChips(){
  const F = S.filt, box = $('#filt-chips'); const small = scaleCanvas(F.base, 160);
  box.innerHTML = FILTERS.map(([k, l]) => `<button class="fchip" data-f="${k}" aria-pressed="${F.f === k}"><canvas width="116" height="148"></canvas>${l}</button>`).join('');
  $$('.fchip', box).forEach(b => { const cv = $('canvas', b), x = cv.getContext('2d'), im = applyFilter(small, b.dataset.f);
    const s = Math.max(116/im.width, 148/im.height); x.drawImage(im, (116 - im.width*s)/2, (148 - im.height*s)/2, im.width*s, im.height*s); });
}
$('#filt-chips').addEventListener('click', e => { const b = e.target.closest('.fchip'); if (!b) return; S.filt.f = b.dataset.f; lsSet('sd-filter', S.filt.f);
  $$('.fchip').forEach(x => x.setAttribute('aria-pressed', x === b)); drawFilt(); });
function drawFilt(){
  const F = S.filt; if (!F) return; const area = $('#filt-area'), cv = $('#filt-cv'), im = previewFor(F.f);
  const sc = Math.min((area.clientWidth - 32)/im.width, (area.clientHeight - 24)/im.height), dpr = Math.min(2, window.devicePixelRatio || 1);
  const dw = Math.round(im.width*sc), dh = Math.round(im.height*sc); cv.width = dw*dpr; cv.height = dh*dpr; cv.style.width = dw + 'px'; cv.style.height = dh + 'px';
  const x = cv.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(im, 0, 0, cv.width, cv.height);
}
$('#filt-rot').addEventListener('click', () => { const F = S.filt; F.base = rotate90(F.base, 1); buildPreview(); renderChips(); drawFilt(); });
$('#filt-back').addEventListener('click', () => { $('#filt').hidden = true; $('#crop').hidden = false; layoutCrop(); });
async function commitFilt(){
  const F = S.filt; busy('#filt-area', 'Enregistrement de la page…'); await frame();
  const page = await makePage(applyFilter(F.base, F.f)); S.session.pages.push(page); unbusy('#filt-area');
}
$('#filt-done').addEventListener('click', async () => { await commitFilt(); S.session.queue = []; finishSession(); });
$('#filt-more').addEventListener('click', async () => {
  await commitFilt();
  if (S.session.queue.length) nextInQueue();
  else if (LIVE_CAM){ $('#filt').hidden = true; openCam(); }
  else { $('#filt').hidden = true; $('#crop').hidden = false; busy('#crop-area', 'En attente de la photo…'); inCam.click(); waitPicker(); }
});
// If the camera picker is dismissed without a photo, close the session with the pages already taken.
function waitPicker(){
  S.session.waiting = true;
  const b = $('#crop .busy'); if (b){ const done = document.createElement('button'); done.className = 'sbtn go'; done.style.marginTop = '14px'; done.textContent = 'Terminer sans nouvelle page';
    done.addEventListener('click', () => { S.session.queue = []; finishSession(); }); $('div', b).appendChild(done); }
}

/* ---------- live camera with edge tracking + auto-capture ---------- */
const LIVE_CAM = !hasClaude && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext;
const CAM = { stream: null, timer: 0, quad: null, stable: 0, auto: lsGet('sd-auto') !== '0', busy: false };
async function openCam(){
  $('#cam').hidden = false; $('#cam-hint').textContent = "Ouverture de l'appareil photo…";
  $('#cam-auto').textContent = CAM.auto ? 'Auto : oui' : 'Auto : non'; $('#cam-auto').setAttribute('aria-pressed', CAM.auto);
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } } });
    const v = $('#cam-v'); v.srcObject = CAM.stream; await v.play().catch(() => {});
    const track = CAM.stream.getVideoTracks()[0], caps = track.getCapabilities ? track.getCapabilities() : {};
    $('#cam-torch').hidden = !caps.torch; CAM.torch = false;
    try { if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch(e){}
    $('#cam-hint').textContent = 'Placez le document dans le cadre'; CAM.stable = 0; CAM.quad = null; loopCam();
  } catch(e){
    $('#cam-hint').innerHTML = 'Caméra indisponible. <button class="sbtn go" id="cam-fallback">Utiliser l\'appareil photo</button>';
    $('#cam-fallback').addEventListener('click', () => { closeCam(); inCam.click(); });
  }
}
function closeCam(){ clearTimeout(CAM.timer); if (CAM.stream){ CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; } $('#cam').hidden = true; }
function camRect(){ const v = $('#cam-v'), a = $('#cam-area'), vw = v.videoWidth, vh = v.videoHeight, aw = a.clientWidth, ah = a.clientHeight, s = Math.min(aw/vw, ah/vh);
  return { s, ox: (aw - vw*s)/2, oy: (ah - vh*s)/2, aw, ah }; }
function loopCam(){
  clearTimeout(CAM.timer); if (!CAM.stream) return;
  const v = $('#cam-v');
  if (v.videoWidth && !CAM.busy){
    const sc = Math.min(1, 360/Math.max(v.videoWidth, v.videoHeight)), c = mk(v.videoWidth*sc, v.videoHeight*sc); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    const q = detectCorners(c, 360), full = q && q.map(([x, y]) => [x/sc, y/sc]);
    const diag = Math.hypot(v.videoWidth, v.videoHeight);
    if (full && CAM.quad && Math.max(...full.map((p, i) => dist(p, CAM.quad[i])))/diag < .02) CAM.stable++; else CAM.stable = full ? 1 : 0;
    CAM.quad = full ? (CAM.quad && CAM.stable > 1 ? full.map((p, i) => [(p[0] + CAM.quad[i][0])/2, (p[1] + CAM.quad[i][1])/2]) : full) : null;
    drawCamOverlay();
    $('#cam-hint').textContent = !full ? 'Recherche du document…' : CAM.auto ? (CAM.stable >= 2 ? 'Ne bougez plus…' : 'Document détecté') : 'Document détecté · appuyez pour scanner';
    if (CAM.auto && full && CAM.stable >= 5){ capture(); return; }
  }
  CAM.timer = setTimeout(loopCam, 180);
}
function drawCamOverlay(){
  const ov = $('#cam-ov'), r = camRect(), dpr = Math.min(2, devicePixelRatio || 1); ov.width = r.aw*dpr; ov.height = r.ah*dpr;
  const x = ov.getContext('2d'); x.scale(dpr, dpr); x.clearRect(0, 0, r.aw, r.ah); if (!CAM.quad) return;
  const p = CAM.quad.map(([a, b]) => [r.ox + a*r.s, r.oy + b*r.s]), k = Math.min(1, CAM.stable/5);
  x.beginPath(); p.forEach((q, i) => i ? x.lineTo(...q) : x.moveTo(...q)); x.closePath();
  x.fillStyle = `rgba(60,196,150,${.12 + .25*k})`; x.fill(); x.lineWidth = 3; x.strokeStyle = '#3CC496'; x.stroke();
  x.fillStyle = '#fff'; p.forEach(q => { x.beginPath(); x.arc(q[0], q[1], 6, 0, 7); x.fill(); });
}
async function capture(){
  const v = $('#cam-v'); if (!v.videoWidth || CAM.busy) return; CAM.busy = true; clearTimeout(CAM.timer);
  const f = $('#cam-flash'); f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
  let c = mk(v.videoWidth, v.videoHeight); c.getContext('2d').drawImage(v, 0, 0);
  try { // full-resolution still when the browser supports it
    const ic = window.ImageCapture && new ImageCapture(CAM.stream.getVideoTracks()[0]);
    if (ic){ const blob = await ic.takePhoto(); const big = await fileToCanvas(blob); if (Math.abs(big.width/big.height - c.width/c.height) < .02) c = big; }
  } catch(e){}
  const k = c.width/v.videoWidth, q = CAM.quad ? CAM.quad.map(([x, y]) => [x*k, y*k]) : null;
  closeCam(); CAM.busy = false;
  if (!S.session) S.session = { target: null, pages: [], queue: [], total: 0 };
  S.session.queue.push({ canvas: c, q }); S.session.total++; nextInQueue();
}
$('#cam-shot').addEventListener('click', capture);
$('#cam-close').addEventListener('click', () => { closeCam(); if (S.session && S.session.pages.length) finishSession(); else { S.session = null; closeEditors(); } });
$('#cam-auto').addEventListener('click', e => { CAM.auto = !CAM.auto; lsSet('sd-auto', CAM.auto ? '1' : '0'); e.currentTarget.textContent = CAM.auto ? 'Auto : oui' : 'Auto : non'; e.currentTarget.setAttribute('aria-pressed', CAM.auto); CAM.stable = 0; });
$('#cam-gal').addEventListener('click', () => { closeCam(); inGal.click(); });
$('#cam-torch').addEventListener('click', async () => { try { CAM.torch = !CAM.torch; await CAM.stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: CAM.torch }] }); } catch(e){ toast('Flash indisponible'); } });

/* ---------- document view ---------- */
function openDoc(id){ S.docId = id; renderDoc(); show('doc'); }
function renderDoc(){
  const d = curDoc(); if (!d){ show('home'); renderHome(); return; }
  $('#doc-name').value = d.name;
  $('#doc-meta').textContent = `${d.pages.length} page${d.pages.length > 1 ? 's' : ''} · ${fmtSize(docSize(d))} · modifié le ${fmtDate(d.updated)}`;
  $('#doc-pages').innerHTML = d.pages.map((p, i) => `<button class="pg" data-i="${i}"><span class="img"><img alt="Page ${i+1}" src="${urlFor(p)}"></span><span class="mono"><span>Page ${i+1}</span><span>${p.w}×${p.h}</span></span></button>`).join('')
    + `<button class="pg" data-add="1" style="border-style:dashed;justify-content:center"><span class="img" style="color:var(--muted);gap:6px">${I.cam}<span class="mono">Ajouter</span></span><span class="mono">&nbsp;</span></button>`;
}
$('#doc-back').addEventListener('click', () => { show('home'); renderHome(); });
$('#doc-name').addEventListener('change', async e => { const d = curDoc(); d.name = e.target.value.trim() || d.name; d.updated = Date.now(); await Store.put(d); renderDoc(); });
$('#doc-pages').addEventListener('click', e => { const b = e.target.closest('.pg'); if (!b) return; if (b.dataset.add) return scanSheet(S.docId); pageSheet(+b.dataset.i); });
$('#docbar').addEventListener('click', e => {
  const b = e.target.closest('[data-d]'); if (!b) return; const d = curDoc(); const k = b.dataset.d;
  if (k === 'add') scanSheet(d.id);
  else if (k === 'ocr') openOcr(d);
  else if (k === 'pdf') exportSheet(d);
  else if (k === 'sign') openTool('sign', { doc: d });
  else if (k === 'more') moreSheet(d);
});
function pageSheet(i){
  const d = curDoc(), p = d.pages[i];
  sheet(`<div class="row" style="justify-content:space-between"><h2>Page ${i+1} / ${d.pages.length}</h2><span class="mono muted">${fmtSize(p.blob.size)}</span></div>
    <div class="big-prev"><img alt="Page ${i+1}" src="${fullUrl(p)}"></div>
    <div class="grid2">
      <button class="btn" data-p="rot">${I.rot}Pivoter</button>
      <button class="btn" data-p="jpg">${I.dl}Exporter JPG</button>
      <button class="btn" data-p="left" ${i === 0 ? 'disabled' : ''}>${I.left}Avancer</button>
      <button class="btn" data-p="right" ${i === d.pages.length - 1 ? 'disabled' : ''}>Reculer${I.right}</button>
    </div>
    <button class="btn danger block" data-p="del">${I.trash}Supprimer cette page</button>`, el => el.addEventListener('click', async e => {
    const b = e.target.closest('[data-p]'); if (!b || b.disabled) return; const k = b.dataset.p;
    if (k === 'rot'){ b.disabled = true; const c = rotate90(await blobToCanvas(p.blob), 1); const np = await makePage(c, .9); d.pages[i] = np; }
    else if (k === 'jpg'){ await saveFile(`${safeName(d.name)} - page ${i+1}.jpg`, p.blob); return; }
    else if (k === 'left'){ [d.pages[i-1], d.pages[i]] = [d.pages[i], d.pages[i-1]]; }
    else if (k === 'right'){ [d.pages[i+1], d.pages[i]] = [d.pages[i], d.pages[i+1]]; }
    else if (k === 'del'){ if (!arm(b, 'Confirmer la suppression')) return; d.pages.splice(i, 1); }
    d.updated = Date.now(); await Store.put(d); closeSheet();
    if (!d.pages.length){ await Store.del(d.id); S.docs = S.docs.filter(x => x !== d); show('home'); renderHome(); toast('Document supprimé (plus aucune page).'); return; }
    renderDoc(); if (k === 'rot') pageSheet(i); else if (k === 'left') pageSheet(i-1); else if (k === 'right') pageSheet(i+1);

/* ---------- OCR (Claude reads the pages) ---------- */
async function openOcr(d){
  openToolShell('Texte (OCR)', () => openDoc(d.id));
  const body = $('#tool-body');
  body.innerHTML = `<div class="card"><div class="stat"><h3>${esc(d.name)}</h3><span class="mono muted">${d.pages.length} p.</span></div>
    <p class="note" id="ocr-note">Le texte de chaque page est reconnu en français et en anglais. Il reste modifiable avant copie.</p>
    <div class="field"><label class="label" for="ocr-pages">Pages</label><select id="ocr-pages"><option value="all">Toutes les pages</option>${d.pages.map((p, i) => `<option value="${i}">Page ${i+1}</option>`).join('')}</select></div>
    <button class="btn primary block" id="ocr-go">${I.text}Extraire le texte</button>
    <p class="note" id="ocr-status"></p></div>
    <div class="field"><label class="label" for="ocr-out">Texte reconnu (modifiable)</label><textarea id="ocr-out" class="ocr-out" placeholder="Le texte apparaîtra ici."></textarea></div>
    <div class="grid2"><button class="btn" id="ocr-copy">${I.copy}Copier</button><button class="btn" id="ocr-txt">${I.dl}Fichier .txt</button></div>`;
  const sample = await CAP.sample; const go = $('#ocr-go'), st = $('#ocr-status');
  const lim = sample ? await sample.limits().catch(() => null) : null;
  const useClaude = !!(sample && lim && lim.images), useTess = !useClaude && !hasClaude;
  if (!useClaude && !useTess){ go.disabled = true; st.textContent = "La reconnaissance de texte n'est pas disponible dans cette vue (elle passe par votre compte Claude)."; }
  let ctl = null, tessStop = false, tessRun = false;
  if (useTess) go.addEventListener('click', async e => {
    e.stopImmediatePropagation();
    if (tessRun){ tessStop = true; st.textContent = 'Arrêt après la page en cours…'; return; }
    const sel = $('#ocr-pages').value, idx = sel === 'all' ? d.pages.map((_, i) => i) : [+sel], out = $('#ocr-out');
    tessRun = true; tessStop = false; go.innerHTML = 'Arrêter'; out.value = ''; let acc = '', cur = 0, worker = null;
    try {
      st.textContent = 'Préparation de la reconnaissance (premier usage : téléchargement des langues)…';
      await loadScript(JSD + 'tesseract.js@5.1.1/dist/tesseract.min.js');
      worker = await Tesseract.createWorker(['fra', 'eng'], 1, { logger: m => { if (m.status === 'recognizing text') st.textContent = `Lecture de la page ${cur} : ${Math.round(m.progress*100)} %`; } });
      for (const i of idx){ if (tessStop) break; cur = i + 1;
        const c = scaleCanvas(await blobToCanvas(d.pages[i].blob), 2400); const { data } = await worker.recognize(c);
        acc += (idx.length > 1 ? `--- Page ${i+1} ---\n` : '') + data.text.trim() + '\n\n'; out.value = acc; }
      st.textContent = tessStop ? 'Reconnaissance arrêtée.' : 'Texte extrait. Vous pouvez le corriger avant de le copier.';
    } catch(err){ console.error(err); st.textContent = "La reconnaissance n'a pas abouti. Vérifiez la connexion internet (premier usage) et réessayez."; }
    if (worker) worker.terminate().catch(() => {});
    tessRun = false; go.innerHTML = `${I.text}Extraire le texte`;
  });
  go.addEventListener('click', async () => {
    if (ctl){ ctl.abort(); return; }
    const sel = $('#ocr-pages').value, idx = sel === 'all' ? d.pages.map((_, i) => i) : [+sel];
    const per = Math.max(1, Math.min(lim.images.maxCount || 1, 5)); const out = $('#ocr-out'); let acc = '';
    ctl = new AbortController(); go.innerHTML = 'Arrêter'; out.value = '';
    try {
      for (let s = 0; s < idx.length; s += per){
        const batch = idx.slice(s, s + per); st.textContent = `Lecture des pages ${batch[0]+1}${batch.length > 1 ? '–' + (batch[batch.length-1]+1) : ''} sur ${d.pages.length}…`;
        const imgs = []; for (const i of batch){ const c = scaleCanvas(await blobToCanvas(d.pages[i].blob), 2000); imgs.push(await toBlob(c, 'image/jpeg', .9)); }
        const prompt = `Tu es un moteur OCR. Voici ${batch.length} image(s) de pages scannées, dans l'ordre : ${batch.map(i => 'page ' + (i+1)).join(', ')}.
Transcris fidèlement tout le texte visible, dans sa langue d'origine, sans traduire, résumer ni corriger.
Avant chaque page, écris une ligne exactement de la forme : --- Page N ---
Garde les retours à la ligne, les listes et les titres. Pour un tableau, mets une ligne par rangée et sépare les cellules par " | ".
Si un passage est illisible, écris [illisible]. Réponds uniquement avec le texte transcrit.`;
        const prefix = acc;
        const { text } = await sample(prompt, { images: imgs, signal: ctl.signal, onText: ({ text }) => { out.value = prefix + text; } });
        acc = prefix + text.trim() + '\n\n'; out.value = acc;
      }
      st.textContent = 'Texte extrait. Vous pouvez le corriger avant de le copier.';
    } catch(e){
      if (e && e.text) out.value = acc + e.text;
      const m = { cancelled: 'Reconnaissance arrêtée.', not_granted: "Accès à Claude refusé pour cette page.", rate_limited: 'Trop de demandes pour le moment, réessayez dans un instant.', image_rejected: "Une image n'a pas été acceptée.", refused: 'Claude a refusé de lire ce contenu.' };
      st.textContent = m[e && e.code] || "La reconnaissance n'a pas abouti. Réessayez.";
    }
    ctl = null; go.innerHTML = `${I.text}Extraire le texte`;
  });
  $('#ocr-copy').addEventListener('click', async () => { const t = $('#ocr-out'); try { await navigator.clipboard.writeText(t.value); toast('Texte copié'); } catch(e){ t.focus(); t.select(); toast('Texte sélectionné : copiez-le avec le menu.'); } });
  $('#ocr-txt').addEventListener('click', () => { const v = $('#ocr-out').value.trim(); if (!v) return toast("Aucun texte à enregistrer."); saveFile(safeName(d.name) + '.txt', new Blob([v], { type: 'text/plain' })); });
}

        p.drawText(txt, { x: cx - (tw/2)*Math.cos(th) + (size*.35)*Math.sin(th), y: cy - (tw/2)*Math.sin(th) - (size*.35)*Math.cos(th), size, font, color: rgb(r, g, bl), opacity: op, rotate: degrees(ang) }); }
      const bytes = await doc.save(); await saveFile(src.name + ' (filigrane).pdf', new Blob([bytes], { type: 'application/pdf' }));
    } catch(e){ console.error(e); toast(/WinAnsi|encode/i.test(String(e && e.message)) ? 'Utilisez des lettres sans caractères spéciaux.' : 'Le filigrane n\'a pas pu être appliqué.'); } b.disabled = false; });
}

function tool_sign(body, opts){
  let src = null, pdf = null, pageN = 1, sig = null, box = { x: .55, y: .8, w: .3 };
  body.innerHTML = `<div id="sg-src"></div>
    <div class="card"><div class="stat"><span class="label">Votre signature</span><span class="row" style="gap:6px">
      <button class="btn" style="height:34px;padding:0 10px" data-ink="#111111" aria-label="Encre noire">Noir</button><button class="btn" style="height:34px;padding:0 10px;color:#1f4fbf" data-ink="#1f4fbf" aria-label="Encre bleue">Bleu</button>
      <button class="btn" style="height:34px;padding:0 10px" id="sg-clear">Effacer</button></span></div>
      <canvas class="pad" id="sg-pad"></canvas><p class="note">Signez dans le cadre avec le doigt ou la souris.</p>
      <button class="btn" id="sg-use">Placer la signature sur la page</button></div>
    <div class="card" id="sg-place" hidden><div class="stat"><span class="label">Placement</span><span class="row" style="gap:6px"><button class="iconbtn" id="sg-prev" aria-label="Page précédente">${I.left}</button><span class="mono" id="sg-pn"></span><button class="iconbtn" id="sg-next" aria-label="Page suivante">${I.right}</button></span></div>
      <div class="sigwrap" id="sg-wrap"><canvas id="sg-cv"></canvas><img id="sg-img" alt="Signature"></div>
      <div class="field"><label class="label" for="sg-w">Taille de la signature</label><input id="sg-w" type="range" min="10" max="70" value="30"></div>
      <p class="note">Faites glisser la signature à l'endroit voulu.</p></div>
    <button class="btn primary block" id="sg-go" disabled>${I.pen}Signer et télécharger</button>`;
  // pad
  const pad = $('#sg-pad'); let ink = '#111111', drawing = false, last = null, dirty = false;
  const fit = () => { const r = pad.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); pad.width = r.width*dpr; pad.height = r.height*dpr; const x = pad.getContext('2d'); x.scale(dpr, dpr); x.lineCap = x.lineJoin = 'round'; dirty = false; };
  requestAnimationFrame(fit);
  pad.addEventListener('pointerdown', e => { drawing = true; pad.setPointerCapture(e.pointerId); const r = pad.getBoundingClientRect(); last = [e.clientX - r.left, e.clientY - r.top]; });
  pad.addEventListener('pointermove', e => { if (!drawing) return; const r = pad.getBoundingClientRect(), p = [e.clientX - r.left, e.clientY - r.top], x = pad.getContext('2d');
    x.strokeStyle = ink; x.lineWidth = Math.max(1.6, 3.4 - Math.hypot(p[0]-last[0], p[1]-last[1])*.06); x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last = p; dirty = true; });
  const stop = () => drawing = false; pad.addEventListener('pointerup', stop); pad.addEventListener('pointercancel', stop);
  $('#sg-clear').addEventListener('click', fit);
  $$('[data-ink]', body).forEach(b => b.addEventListener('click', () => ink = b.dataset.ink));
  sourceBlock($('#sg-src'), { doc: opts.doc, label: 'Document à signer', onPick: async s => { src = s; try { pdf = await openPdf(s.bytes); pageN = pdf.numPages; if (sig) await drawPage(); } catch(e){ toast("Ce PDF n'a pas pu être ouvert."); } upd(); } });
  const upd = () => { $('#sg-go').disabled = !(src && sig && pdf); };
  function trimPad(){ const x = pad.getContext('2d'), { width: w, height: h } = pad, d = x.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) if (d[(y*w + i)*4 + 3] > 10){ if (i < x0) x0 = i; if (i > x1) x1 = i; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 <= x0) return null; const pd = 6; x0 = Math.max(0, x0 - pd); y0 = Math.max(0, y0 - pd); x1 = Math.min(w - 1, x1 + pd); y1 = Math.min(h - 1, y1 + pd);
    const o = mk(x1 - x0, y1 - y0); o.getContext('2d').drawImage(pad, x0, y0, o.width, o.height, 0, 0, o.width, o.height); return o; }
  $('#sg-use').addEventListener('click', async () => { if (!dirty) return toast("Dessinez d'abord votre signature."); const t = trimPad(); if (!t) return;
    sig = { canvas: t, ratio: t.height/t.width, url: t.toDataURL('image/png') }; $('#sg-img').src = sig.url;
    if (!pdf){ toast('Choisissez maintenant le PDF à signer.'); upd(); return; } await drawPage(); upd(); $('#sg-place').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  async function drawPage(){
    $('#sg-place').hidden = false; $('#sg-pn').textContent = `Page ${pageN} / ${pdf.numPages}`;
    const wrapW = Math.min(body.clientWidth - 34, 520); const p = await pdf.getPage(pageN); const vp1 = p.getViewport({ scale: 1 });
    const r = await renderPdfPage(pdf, pageN, wrapW/vp1.width*Math.min(2, devicePixelRatio || 1)); const cv = $('#sg-cv'); cv.width = r.canvas.width; cv.height = r.canvas.height;
    cv.getContext('2d').drawImage(r.canvas, 0, 0); cv.style.width = wrapW + 'px'; placeSig();
  }
  function placeSig(){ const cv = $('#sg-cv'), im = $('#sg-img'), W = parseFloat(cv.style.width), H = W*cv.height/cv.width;
    box.w = +$('#sg-w').value/100; const w = W*box.w, h = w*sig.ratio; box.x = Math.min(Math.max(0, box.x), 1 - box.w); box.y = Math.min(Math.max(0, box.y), 1 - h/H);
    Object.assign(im.style, { width: w + 'px', height: h + 'px', left: box.x*W + 'px', top: box.y*H + 'px' }); }
  $('#sg-w').addEventListener('input', () => sig && placeSig());
  $('#sg-prev').addEventListener('click', () => { if (pageN > 1){ pageN--; drawPage(); } });
  $('#sg-next').addEventListener('click', () => { if (pageN < pdf.numPages){ pageN++; drawPage(); } });
  (() => { const im = $('#sg-img'); let st = null;
    im.addEventListener('pointerdown', e => { e.preventDefault(); im.setPointerCapture(e.pointerId); st = { x: e.clientX, y: e.clientY, bx: box.x, by: box.y }; });
    im.addEventListener('pointermove', e => { if (!st) return; const cv = $('#sg-cv'), W = parseFloat(cv.style.width), H = W*cv.height/cv.width; box.x = st.bx + (e.clientX - st.x)/W; box.y = st.by + (e.clientY - st.y)/H; placeSig(); });
    const up = () => st = null; im.addEventListener('pointerup', up); im.addEventListener('pointercancel', up); })();
  $('#sg-go').addEventListener('click', async ev => { const b = ev.currentTarget; b.disabled = true;
    try { const { PDFDocument } = await pdfLib(); const doc = await PDFDocument.load(src.bytes, { ignoreEncryption: true });
      const png = await doc.embedPng(sig.url); const p = doc.getPages()[pageN - 1]; const { width, height } = p.getSize();
      const w = width*box.w, h = w*sig.ratio; p.drawImage(png, { x: box.x*width, y: height - box.y*height - h, width: w, height: h });
      const bytes = await doc.save(); await saveFile(src.name + ' (signé).pdf', new Blob([bytes], { type: 'application/pdf' }));
    } catch(e){ console.error(e); toast("La signature n'a pas pu être ajoutée."); } b.disabled = false; });
}

/* ---------- example document (first visit) ---------- */
async function makeSample(){
  const c = mk(1240, 1754), x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  const T = (t, px, py, f, col='#1b1b1b') => { x.font = f; x.fillStyle = col; x.fillText(t, px, py); };
  x.fillStyle = '#0D7A5C'; x.fillRect(90, 90, 70, 70); T('TRANSIT LAGUNE SARL', 185, 125, '700 34px Helvetica, Arial'); T('Zone portuaire, Treichville · Abidjan', 185, 160, '24px Helvetica, Arial', '#555');
  T('BON DE LIVRAISON', 90, 270, '700 52px Helvetica, Arial'); T('N° BL-2026-0418 · Exemple fictif', 90, 315, '26px Helvetica, Arial', '#666');
  const rows = [['Client', 'Société Exemple SA'], ['Date', '23/10/2026'], ['Conteneur', 'MSKU 123456-7 · 40\' HC'], ['Navire / Voyage', 'MV Exemple · 042E'], ['Destination', 'Yopougon, Abidjan']];
  rows.forEach(([k, v], i) => { T(k, 90, 400 + i*48, '24px Helvetica, Arial', '#666'); T(v, 420, 400 + i*48, '600 26px Helvetica, Arial'); });
  x.strokeStyle = '#222'; x.lineWidth = 2; x.strokeRect(90, 680, 1060, 420); x.fillStyle = '#f0f0f0'; x.fillRect(91, 681, 1058, 60);
  ['Désignation', 'Colis', 'Poids (kg)'].forEach((h, i) => T(h, [110, 720, 900][i], 722, '700 24px Helvetica, Arial'));
  [['Cartons de marchandises diverses', '120', '3 450'], ['Palettes filmées', '8', '2 100'], ['Fûts plastique 200 L', '24', '1 280']].forEach((r, j) => r.forEach((v, i) => T(v, [110, 720, 900][i], 800 + j*60, '24px Helvetica, Arial')));
  x.beginPath(); x.moveTo(90, 741); x.lineTo(1150, 741); x.moveTo(700, 680); x.lineTo(700, 1100); x.moveTo(880, 680); x.lineTo(880, 1100); x.stroke();
  T('Total : 152 colis · 6 830 kg', 90, 1170, '700 28px Helvetica, Arial');
  T('Signature du transporteur', 90, 1420, '24px Helvetica, Arial', '#666'); T('Cachet et signature du client', 700, 1420, '24px Helvetica, Arial', '#666');
  x.strokeRect(90, 1440, 450, 180); x.strokeRect(700, 1440, 450, 180);
  return { id: uid(), name: 'Exemple · Bon de livraison', sample: true, created: Date.now(), updated: Date.now() - 3600e3, pages: [await makePage(c, .86)] };
}
